name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]   # a docs-only change needs no run (saves macOS minutes)
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:   # the "Run workflow" button, for re-running CI without a new commit

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          locked: true   # fail if pixi.lock is out of date with pixi.toml
          cache: true
          environments: default lint test
      - name: Lint
        run: pixi run -e lint lint
      - name: Test (no network needed)
        run: pixi run -e test test

  python310:
    name: Test on Python 3.10 (the oldest supported)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          locked: true
          cache: true
          environments: py310
      - run: pixi run -e py310 test
