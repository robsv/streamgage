[workspace]
authors = ["Rob Svirskas"]
channels = ["conda-forge"]
description = "Interactive map of a river with USGS stream gages colored by current stage"
license = "BSD-3-Clause"
name = "streamgage"
platforms = ["osx-arm64", "osx-64", "linux-64"]
version = "0.1.0"

[dependencies]
python = ">=3.10"
requests = ">=2.34.2,<3"

[tasks.map]
cmd = "python streamgage.py"
description = "Draw a river map, e.g. pixi run map \"Peace River\""

[feature.lint.dependencies]
ruff = ">=0.16.7,<0.17"

[feature.lint.tasks]
lint = { cmd = "ruff check .", description = "Lint the codebase with ruff" }

[feature.test.dependencies]
pytest = ">=8,<10"
nodejs = ">=20"  # runs the page's JavaScript logic tests; they skip when node is missing

[feature.test.tasks]
test = { cmd = "pytest -q", description = "Run the tests (no network needed)" }

[feature.py310.dependencies]
python = "3.10.*"  # the oldest supported version, so CI can prove the claim

[environments]
py310 = { features = ["py310", "test"] }
test = { features = ["test"] }
lint = { features = ["lint"], no-default-feature = true }
